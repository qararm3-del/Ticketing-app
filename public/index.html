<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1f3a">
<title>Fly Next Social Hub</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="brand">✈ <span>Fly Next</span></div>
    <h1>Social Hub</h1>
    <p>Unified ticketing lead inbox</p>

    <input id="email" type="email" placeholder="Email" value="admin@flynext.pk">
    <input id="password" type="password" placeholder="Password" value="Admin@123">
    <button onclick="login()">Sign in</button>

    <div id="loginError" class="error"></div>
  </div>
</div>

<div id="app" class="hidden">

<header>
  <div class="brand">✈ <span>Fly Next</span></div>
  <div class="header-right">
    <span id="userName"></span>
    <button class="ghost" onclick="logout()">Logout</button>
  </div>
</header>

<main>

<section class="topbar">
  <div>
    <h1>Unified Inbox</h1>
    <p>Facebook • Instagram • WhatsApp • TikTok • YouTube</p>
  </div>
  <button onclick="openLead()">+ New Ticket Request</button>
</section>

<section id="stats" class="stats"></section>

<section class="layout">

<aside class="filters card">
  <h3>Filters</h3>

  <input id="search"
         placeholder="Search customer, route..."
         oninput="loadLeads()">

  <select id="status" onchange="loadLeads()">
    <option value="">All Status</option>
  </select>

  <select id="category" onchange="loadLeads()">
    <option value="">All Categories</option>
  </select>

  <select id="channel" onchange="loadLeads()">
    <option value="">All Channels</option>
  </select>

  <hr>

  <h3>Quick categories</h3>
  <div id="quick"></div>
</aside>

<section class="card inbox">
  <div class="section-head">
    <h2>Ticket Leads</h2>
    <span id="count"></span>
  </div>

  <div id="leads"></div>
</section>

<section class="card detail" id="detail">
  <div class="empty">
    Select a lead to view conversation.
  </div>
</section>

</section>
</main>
</div>

<div id="modal" class="modal hidden">

<div class="modal-card">

  <div class="section-head">
    <h2>New Ticket Request</h2>
    <button class="ghost" onclick="closeLead()">×</button>
  </div>

  <input id="newName" placeholder="Customer / Agent name">

  <select id="newChannel"></select>

  <select id="newCategory"></select>

  <input id="newRoute" placeholder="Route e.g. PEW-JED">

  <textarea id="newMessage"
            placeholder="Requirement / message"></textarea>

  <button onclick="createLead()">Create Request</button>

</div>
</div>

<script src="/app.js"></script>

</body>
  </html>
