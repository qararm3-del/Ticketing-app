name: Fly Next backend checks

on:
  push:
    branches: [main, feature/airline-updates]
  pull_request:
    branches: [main]

jobs:
  syntax-and-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check backend syntax
        run: node --check server.js
      - name: Check frontend syntax
        run: node --check public/app.js
      - name: Check Cloudflare Worker syntax
        run: node --check worker/index.mjs
      - name: Check package metadata
        run: node -e "const p=require('./package.json'); if(!p.scripts.start || !p.dependencies.express || !p.dependencies.pg || !p.devDependencies.wrangler) process.exit(1)"
